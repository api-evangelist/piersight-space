name: PierSight Space
description: PierSight Space is an India-based space technology company building a constellation
  of Synthetic Aperture Radar (SAR) and Automatic Identification System (AIS) satellites
  for persistent, all-weather maritime surveillance of the world's oceans. Founded by
  former ISRO engineer Gaurav Seth, PierSight delivers near-real-time ocean monitoring
  (targeting ~30-minute data latency and 100% ocean coverage) to detect illegal, unreported
  and unregulated (IUU) fishing, monitor oil spills, protect Exclusive Economic Zones,
  support maritime insurance risk assessment, and improve shipping operations. The company
  has raised roughly $8M from investors including Alpha Wave Ventures, Elevation Capital,
  and Techstars. As of this enrichment pass PierSight sells data solutions to enterprise
  and government clients and does not publish a public developer API, SDKs, or API documentation.
